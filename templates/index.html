<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Detecting System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f7f8;
            margin: 0;
            padding: 20px;
            color: #243746;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #087f8c;
        }

        .description {
            text-align: center;
            color: #555;
            line-height: 1.6;
        }

        .symptom-list {
            margin: 25px 0;
        }

        .symptom {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #d7e5e8;
            border-radius: 8px;
            cursor: pointer;
        }

        .symptom input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #087f8c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #066570;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .error {
            background: #fff0f0;
            color: #a32121;
        }

        .notice {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>AI Health Detecting System</h1>

        <p class="description">
            Select the symptoms you are experiencing and submit
            them for an educational health-risk assessment.
        </p>

        <form id="healthForm"
              method="POST"
              action="{{ url_for('predict') }}">

            <div class="symptom-list">

                <label class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="fever">
                    Fever
                </label>

                <label class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="cough">
                    Cough
                </label>

                <label class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="fatigue">
                    Fatigue
                </label>

                <label class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="shortness_of_breath">
                    Shortness of breath
                </label>

                <label class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="chest_pain">
                    Chest pain
                </label>

            </div>

            <button type="submit">
                Check Health Risk
            </button>

            <div id="message" role="alert" hidden></div>
        </form>

        <p class="notice">
            This website is for educational purposes only.
            It does not replace professional medical advice.
        </p>

    </div>

    <script>
        const form = document.getElementById("healthForm");
        const checkboxes = form.querySelectorAll(
            'input[name="symptoms"]'
        );
        const message = document.getElementById("message");

        function clearMessage() {
            message.textContent = "";
            message.hidden = true;
            message.className = "";
        }

        checkboxes.forEach(function (checkbox) {
            checkbox.addEventListener("change", function () {
                clearMessage();
            });
        });

        form.addEventListener("submit", function (event) {
            const selected = form.querySelectorAll(
                'input[name="symptoms"]:checked'
            );

            if (selected.length === 0) {
                event.preventDefault();

                message.textContent =
                    "Please select at least one symptom before continuing.";

                message.className = "error";
                message.hidden = false;
            } else {
                clearMessage();
            }
        });
    </script>
</body>
</html>
